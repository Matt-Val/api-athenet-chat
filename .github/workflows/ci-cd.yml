name: Build, Push and Deploy

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: chat_user
          POSTGRES_PASSWORD: chat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat_user -d chat_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://chat_user:chat_test@localhost:5432/chat_test
      # Valores de relleno: config.js exige que existan, pero los tests nunca
      # validan un token contra Cognito (emiten los tickets llamando a issue()
      # directo), asi que el pipeline no necesita el User Pool para correr.
      COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ci
      COGNITO_CLIENT_ID: ci-client-id
      COGNITO_USERINFO_URI: https://ci.example/oauth2/userInfo
      WS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run migrate:prod
      - run: npm test

  build-and-push:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set Docker Hub image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          : "${DOCKERHUB_USERNAME:?Configura la variable DOCKERHUB_USERNAME}"
          echo "name=${DOCKERHUB_USERNAME}/api-athenet-chat" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: chat-ec2-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_APP_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_REF
          command_timeout: 10m
          script: |
            set -eu
            # El archivo con los secretos vive solo en la EC2, nunca en el repo.
            test -s /opt/athenet/chat.env
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN
            docker pull "$IMAGE_REF"
            docker rm -f athenet-chat 2>/dev/null || true
            docker run -d --name athenet-chat --restart unless-stopped \
              -p 8086:8086 --env-file /opt/athenet/chat.env \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --memory 384m --pids-limit 256 \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE_REF"
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                http://127.0.0.1:8086/health || true)
              if [ "$status" = 200 ]; then
                echo 'OK: MS-Chat responde UP tras el despliegue.'
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 3
            done
            echo 'ERROR: el servicio no respondio tras el despliegue.' >&2
            docker logs --tail 50 athenet-chat >&2 || true
            exit 1
